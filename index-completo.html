
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Completo</title>
  <style>
    body {margin:0; font-family:sans-serif;}
    img {max-width:100%; height:auto;}
    .container {max-width:1200px; margin:0 auto; padding:20px;}
  </style>
  <!-- Mantendo scripts de integração -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=GA-ID"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'GA-ID');
  </script>
</head>
<body>
  <div class="container">
    <h1>Bem-vindo ao site com integrações!</h1>
    <p>Este site está otimizado para todos os dispositivos móveis.</p>
    <img src="https://via.placeholder.com/1200x600" alt="Banner exemplo">
  </div>
</body>
</html>
